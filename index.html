<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Rewards - Digital Loyalty Card</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [view, setView] = React.useState('home'); 
            const [mobile, setMobile] = React.useState('');
            const [pin, setPin] = React.useState('');
            const [mobileError, setMobileError] = React.useState('');
            
            const [secretInput, setSecretInput] = React.useState('');
            const [adminPinConfig, setAdminPinConfig] = React.useState('7013');
            const [currentAdminPassword, setCurrentAdminPassword] = React.useState('');
            const [newAdminPassword, setNewAdminPassword] = React.useState('');

            const [config, setConfig] = React.useState(() => {
                const saved = localStorage.getItem('loyalty_master_config');
                return saved ? JSON.parse(saved) : {
                    brandName: "The Copper Skillet",
                    heroBadgeText: "10 stamps = Free Craft Burger & Shake",
                    heroTitle: "Digital Loyalty Card",
                    heroSubtitle: "Collect stamps with every visit and unlock delicious rewards!",
                    logoUrl: "https://placehold.co/100x100/b45309/ffffff?text=CS",
                    heroBgUrl: "https://placehold.co/600x300/78350f/ffffff?text=The+Copper+Skillet",
                    footerText: "© 2026 The Copper Skillet. All rights reserved."
                };
            });

            const [customers, setCustomers] = React.useState(() => {
                const saved = localStorage.getItem('loyalty_customers');
                return saved ? JSON.parse(saved) : {};
            });

            const [searchTerm, setSearchTerm] = React.useState('');

            React.useEffect(() => {
                localStorage.setItem('loyalty_master_config', JSON.stringify(config));
            }, [config]);

            React.useEffect(() => {
                localStorage.setItem('loyalty_customers', JSON.stringify(customers));
            }, [customers]);

            const validateMobile = (num) => {
                const regex = /^[6-9]\d{9}$/;
                return regex.test(num);
            };

            const handleMobileChange = (e) => {
                const val = e.target.value.replace(/\D/g, '').slice(0, 10);
                setMobile(val);
                if (val.length > 0 && !validateMobile(val)) {
                    setMobileError('ప్లీజ్ ఎంటర్ ఏ వాలిడ్ మొబైల్ నంబర్');
                } else {
                    setMobileError('');
                }
            };

            const handleCustomerLogin = (e) => {
                e.preventDefault();
                if (!validateMobile(mobile)) {
                    setMobileError('ప్లీజ్ ఎంటర్ ఏ వాలిడ్ మొబైల్ నంబర్');
                    return;
                }
                if (!pin || pin.length !== 4) {
                    alert('దయచేసి 4 అంకెల పిన్ నంబర్ ఎంటర్ చేయండి.');
                    return;
                }
                if (!customers[mobile]) {
                    setCustomers(prev => ({
                        ...prev,
                        [mobile]: { pin: pin, stamps: 0, history: [] }
                    }));
                } else if (customers[mobile].pin !== pin) {
                    alert('తప్పు పిన్ నంబర్! దయచేసి మళ్లీ ప్రయత్నించండి.');
                    return;
                }
                setView('userDashboard');
            };

            const updateStamps = (mob, delta) => {
                setCustomers(prev => {
                    const current = prev[mob] || { stamps: 0, history: [] };
                    const newStamps = Math.max(0, Math.min(10, current.stamps + delta));
                    return {
                        ...prev,
                        [mob]: {
                            ...current,
                            stamps: newStamps,
                            history: [...current.history, { date: new Date().toLocaleString(), delta }]
                        }
                    };
                });
            };

            const resetCard = (mob) => {
                setCustomers(prev => ({
                    ...prev,
                    [mob]: { ...prev[mob], stamps: 0, history: [...prev[mob].history, { date: new Date().toLocaleString(), delta: 'Reset' }] }
                }));
            };

            const deleteCustomer = (mob) => {
                if (confirm(`మీరు ఖచ్చితంగా ${mob} నంబర్‌ను పర్మనెంట్‌గా డిలీట్ చేయాలనుకుంటున్నారా?`)) {
                    setCustomers(prev => {
                        const updated = { ...prev };
                        delete updated[mob];
                        return updated;
                    });
                }
            };

            const handleSecretLogin = () => {
                if (secretInput === '7013557763') {
                    setView('masterPanel');
                    setSecretInput('');
                } else if (secretInput === adminPinConfig) {
                    setView('adminPanel');
                    setSecretInput('');
                } else {
                    alert('తప్పు పాస్‌కోడ్!');
                }
            };

            const handleUpdateAdminPassword = (e) => {
                e.preventDefault();
                if (currentAdminPassword !== adminPinConfig) {
                    alert('ప్రస్తుత పాస్‌వర్డ్ తప్పుగా ఉంది!');
                    return;
                }
                if (!newAdminPassword || newAdminPassword.length < 4) {
                    alert('కొత్త పాస్‌వర్డ్ కనీసం 4 అంకెలు ఉండాలి.');
                    return;
                }
                setAdminPinConfig(newAdminPassword);
                setCurrentAdminPassword('');
                setNewAdminPassword('');
                alert('అడ్మిన్ పాస్‌వర్డ్ విజయవంతంగా మార్చబడింది!');
            };

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    <header className="bg-amber-900 text-white p-4 shadow-md flex justify-between items-center">
                        <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setView('home')}>
                            <img src={config.logoUrl} alt="Logo" className="w-10 h-10 rounded-full object-cover border-2 border-white"/>
                            <div>
                                <span className="text-lg font-bold block">{config.brandName}</span>
                                <span className="text-xs text-amber-200 block">Digital Loyalty Card</span>
                            </div>
                        </div>
                        <div>
                            <button 
                                onClick={() => setView('loginModal')} 
                                className="w-9 h-9 rounded-full bg-amber-800 border border-amber-600 flex items-center justify-center font-bold text-sm hover:bg-amber-700 shadow"
                                title="Admin / Master Login"
                            >
                                A
                            </button>
                        </div>
                    </header>

                    <main className="flex-grow p-4 max-w-md mx-auto w-full">
                        {view === 'home' && (
                            <div className="space-y-6 text-center">
                                <div className="rounded-xl overflow-hidden shadow-lg bg-cover bg-center h-48 flex items-center justify-center p-4 text-white" style={{ backgroundImage: `url(${config.heroBgUrl})` }}>
                                    <div className="bg-black/50 p-4 rounded-lg w-full">
                                        <h1 className="text-2xl font-bold">{config.heroTitle}</h1>
                                        <p className="text-sm mt-1">{config.heroSubtitle}</p>
                                    </div>
                                </div>
                                <div className="bg-amber-100 text-amber-800 p-3 rounded-lg font-medium text-sm">
                                    {config.heroBadgeText}
                                </div>
                                <div className="bg-white p-6 rounded-xl shadow-md space-y-4">
                                    <h2 className="text-lg font-bold text-slate-800">Customer Login</h2>
                                    <form onSubmit={handleCustomerLogin} className="space-y-3 text-left">
                                        <div>
                                            <input 
                                                type="tel" 
                                                placeholder="Mobile Number (e.g. 9876543210)" 
                                                value={mobile} 
                                                onChange={handleMobileChange}
                                                className="w-full p-3 border rounded-lg text-sm"
                                                maxLength="10"
                                                required
                                            />
                                            {mobileError && <p className="text-red-600 text-xs mt-1 font-semibold">{mobileError}</p>}
                                        </div>
                                        <div>
                                            <input 
                                                type="password" 
                                                placeholder="4-Digit PIN" 
                                                value={pin} 
                                                onChange={(e) => setPin(e.target.value.replace(/\D/g, '').slice(0, 4))}
                                                className="w-full p-3 border rounded-lg text-sm"
                                                maxLength="4"
                                                required
                                            />
                                        </div>
                                        <button type="submit" className="w-full bg-amber-600 text-white p-3 rounded-lg font-bold hover:bg-amber-700 transition">
                                            Open Loyalty Card
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {view === 'loginModal' && (
                            <div className="bg-white p-6 rounded-xl shadow-md space-y-4">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-lg font-bold text-slate-800">Security Login</h2>
                                    <button onClick={() => setView('home')} className="text-sm text-red-600 font-semibold">Back</button>
                                </div>
                                <p className="text-xs text-slate-500">అడ్మిన్ లేదా మాస్టర్ పాస్‌కోడ్ ఎంటర్ చేయండి:</p>
                                <input 
                                    type="password" 
                                    placeholder="Enter Passcode..." 
                                    value={secretInput} 
                                    onChange={(e) => setSecretInput(e.target.value)}
                                    className="w-full p-3 border rounded-lg text-sm"
                                />
                                <button onClick={handleSecretLogin} className="w-full bg-slate-900 text-white p-3 rounded-lg font-bold hover:bg-slate-800">
                                    Login
                                </button>
                            </div>
                        )}

                        {view === 'userDashboard' && customers[mobile] && (
                            <div className="bg-white p-6 rounded-xl shadow-md space-y-6">
                                <div className="flex justify-between items-center border-b pb-4">
                                    <h2 className="font-bold text-lg">{mobile}</h2>
                                    <button onClick={() => setView('home')} className="text-sm text-red-600 font-medium">Logout</button>
                                </div>
                                <div className="text-center bg-amber-50 p-4 rounded-xl border border-amber-200">
                                    <p className="text-sm text-amber-800 font-semibold">Your Stamps</p>
                                    <p className="text-3xl font-black text-amber-900 mt-1">{customers[mobile].stamps} / 10</p>
                                </div>
                                <div className="grid grid-cols-5 gap-3">
                                    {[...Array(10)].map((_, idx) => {
                                        const isStamped = idx < customers[mobile].stamps;
                                        return (
                                            <div key={idx} className={`h-14 rounded-xl flex items-center justify-center font-bold text-sm border-2 ${isStamped ? 'bg-amber-600 text-white border-amber-600 shadow' : 'bg-slate-100 text-slate-400 border-dashed border-slate-300'}`}>
                                                {idx + 1 === 10 ? '🎁' : `⭐ ${idx + 1}`}
                                            </div>
                                        );
                                    })}
                                </div>
                                <p className="text-xs text-center text-slate-500">Show this card at the counter to get your stamps!</p>
                            </div>
                        )}

                        {view === 'adminPanel' && (
                            <div className="bg-white p-6 rounded-xl shadow-md space-y-5">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h2 className="font-bold text-lg text-amber-900">Admin Panel</h2>
                                    <button onClick={() => setView('home')} className="text-sm text-red-600 font-semibold">Back to Home</button>
                                </div>
                                
                                <input 
                                    type="text" 
                                    placeholder="Search mobile number..." 
                                    value={searchTerm} 
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="w-full p-2 border rounded-lg text-sm"
                                />

                                <div className="space-y-3 max-h-72 overflow-y-auto pr-1">
                                    {Object.keys(customers).length === 0 ? (
                                        <p className="text-xs text-center text-slate-400 py-4">యూజర్లు ఎవరూ లేరు.</p>
                                    ) : (
                                        Object.keys(customers)
                                            .filter(m => m.includes(searchTerm))
                                            .map(m => (
                                                <div key={m} className="p-3 border rounded-lg bg-slate-50 flex flex-col space-y-2 shadow-sm">
                                                    <div className="flex justify-between items-center">
                                                        <div>
                                                            <span className="font-bold text-sm text-slate-800">{m}</span>
                                                            <span className="text-xs text-slate-500 ml-2">(PIN: {customers[m].pin})</span>
                                                        </div>
                                                        <span className="bg-amber-100 text-amber-800 px-2 py-0.5 rounded text-xs font-bold">{customers[m].stamps}/10 Stamps</span>
                                                    </div>
                                                    <div className="grid grid-cols-4 gap-1 pt-1">
                                                        <button onClick={() => updateStamps(m, 1)} className="bg-green-600 text-white py-1.5 rounded text-xs font-bold hover:bg-green-700">+ Stamp</button>
                                                        <button onClick={() => updateStamps(m, -1)} className="bg-amber-600 text-white py-1.5 rounded text-xs font-bold hover:bg-amber-700">- Stamp</button>
                                                        <button onClick={() => resetCard(m)} className="bg-orange-500 text-white py-1.5 rounded text-xs font-bold hover:bg-orange-600">Reset</button>
                                                        <button onClick={() => deleteCustomer(m)} className="bg-red-600 text-white py-1.5 rounded text-xs font-bold hover:bg-red-700">Delete</button>
                                                    </div>
                                                </div>
                                            ))
                                    )}
                                </div>

                                <div className="border-t pt-4 space-y-3">
                                    <h3 className="text-sm font-bold text-slate-700">Change Admin Password</h3>
                                    <form onSubmit={handleUpdateAdminPassword} className="space-y-2">
                                        <input 
                                            type="password" 
                                            placeholder="Current Admin Password" 
                                            value={currentAdminPassword} 
                                            onChange={(e) => setCurrentAdminPassword(e.target.value)}
                                            className="w-full p-2 border rounded text-xs"
                                            required
                                        />
                                        <input 
                                            type="password" 
                                            placeholder="New Admin Password (min 4 chars)" 
                                            value={newAdminPassword} 
                                            onChange={(e) => setNewAdminPassword(e.target.value)}
                                            className="w-full p-2 border rounded text-xs"
                                            required
                                        />
                                        <button type="submit" className="w-full bg-slate-800 text-white p-2 rounded text-xs font-bold hover:bg-slate-900">
                                            Update Password
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {view === 'masterPanel' && (
                            <div className="bg-white p-6 rounded-xl shadow-md space-y-5">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h2 className="font-bold text-lg text-slate-900">Master Panel (Customization)</h2>
                                    <button onClick={() => setView('home')} className="text-sm text-red-600 font-semibold">Back</button>
                                </div>
                                <div className="space-y-3 max-h-96 overflow-y-auto pr-1">
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600">Brand Name</label>
                                        <input type="text" value={config.brandName} onChange={(e) => setConfig({...config, brandName: e.target.value})} className="w-full p-2 border rounded text-sm"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600">Logo Image URL</label>
                                        <input type="text" value={config.logoUrl} onChange={(e) => setConfig({...config, logoUrl: e.target.value})} className="w-full p-2 border rounded text-sm"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600">Hero Title</label>
                                        <input type="text" value={config.heroTitle} onChange={(e) => setConfig({...config, heroTitle: e.target.value})} className="w-full p-2 border rounded text-sm"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600">Hero Subtitle</label>
                                        <input type="text" value={config.heroSubtitle} onChange={(e) => setConfig({...config, heroSubtitle: e.target.value})} className="w-full p-2 border rounded text-sm"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600">Hero Badge Text</label>
                                        <input type="text" value={config.heroBadgeText} onChange={(e) => setConfig({...config, heroBadgeText: e.target.value})} className="w-full p-2 border rounded text-sm"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600">Hero Background Image URL</label>
                                        <input type="text" value={config.heroBgUrl} onChange={(e) => setConfig({...config, heroBgUrl: e.target.value})} className="w-full p-2 border rounded text-sm"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600">Footer Text</label>
                                        <input type="text" value={config.footerText} onChange={(e) => setConfig({...config, footerText: e.target.value})} className="w-full p-2 border rounded text-sm"/>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="text-center p-4 text-xs text-slate-500 border-t">
                        {config.footerText}
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
