<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Rewards - Digital Loyalty Card</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [view, setView] = React.useState('home'); // home, userDashboard, adminLogin, adminPanel, masterLogin, masterPanel
            const [mobile, setMobile] = React.useState('');
            const [pin, setPin] = React.useState('');
            const [adminPin, setAdminPin] = React.useState('');
            const [masterPin, setMasterPin] = React.useState('');
            
            // Master Customization State
            const [config, setConfig] = React.useState(() => {
                const saved = localStorage.getItem('loyalty_master_config');
                return saved ? JSON.parse(saved) : {
                    brandName: "The Copper Skillet",
                    heroBadgeText: "10 stamps = Free Craft Burger & Shake",
                    heroTitle: "Digital Loyalty Card",
                    heroSubtitle: "Collect stamps with every visit and unlock delicious rewards!",
                    logoUrl: "https://placehold.co/100x100/b45309/ffffff?text=CS",
                    heroBgUrl: "https://placehold.co/600x300/78350f/ffffff?text=The+Copper+Skillet",
                    cardHeaderIcon: "Star",
                    stampModels: Array(9).fill('Star'),
                    rewardModel: "Gift",
                    footerText: "© 2026 The Copper Skillet. All rights reserved."
                };
            });

            // Customers State
            const [customers, setCustomers] = React.useState(() => {
                const saved = localStorage.getItem('loyalty_customers');
                return saved ? JSON.parse(saved) : {};
            });

            const [searchTerm, setSearchTerm] = React.useState('');

            React.useEffect(() => {
                localStorage.setItem('loyalty_master_config', JSON.stringify(config));
            }, [config]);

            React.useEffect(() => {
                localStorage.setItem('loyalty_customers', JSON.stringify(customers));
            }, [customers]);

            const handleCustomerLogin = (e) => {
                e.preventDefault();
                if (!mobile || mobile.length < 10) {
                    alert('Please enter a valid 10-digit mobile number.');
                    return;
                }
                if (!customers[mobile]) {
                    setCustomers(prev => ({
                        ...prev,
                        [mobile]: { pin: pin || '1234', stamps: 0, history: [] }
                    }));
                } else if (customers[mobile].pin !== (pin || '1234')) {
                    alert('Incorrect PIN! Please try again.');
                    return;
                }
                setView('userDashboard');
            };

            const updateStamps = (mob, delta) => {
                setCustomers(prev => {
                    const current = prev[mob] || { stamps: 0, history: [] };
                    const newStamps = Math.max(0, Math.min(10, current.stamps + delta));
                    return {
                        ...prev,
                        [mob]: {
                            ...current,
                            stamps: newStamps,
                            history: [...current.history, { date: new Date().toLocaleString(), delta }]
                        }
                    };
                });
            };

            const resetCard = (mob) => {
                setCustomers(prev => ({
                    ...prev,
                    [mob]: { ...prev[mob], stamps: 0, history: [...prev[mob].history, { date: new Date().toLocaleString(), delta: 'Reset' }] }
                }));
            };

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    {/* Navigation Bar */}
                    <header className="bg-amber-900 text-white p-4 shadow-md flex justify-between items-center">
                        <div className="flex items-center space-x-2 cursor-pointer" onClick={() => setView('home')}>
                            <span className="text-xl font-bold">{config.brandName}</span>
                        </div>
                        <div className="space-x-2">
                            <button onClick={() => setView('adminLogin')} className="bg-amber-800 px-3 py-1 rounded text-sm hover:bg-amber-700">Admin</button>
                            <button onClick={() => setView('masterLogin')} className="bg-amber-700 px-3 py-1 rounded text-sm hover:bg-amber-600">Master</button>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-grow p-4 max-w-md mx-auto w-full">
                        {view === 'home' && (
                            <div className="space-y-6 text-center">
                                <div className="rounded-xl overflow-hidden shadow-lg bg-cover bg-center h-48 flex items-center justify-center p-4 text-white" style={{ backgroundImage: `url(${config.heroBgUrl})` }}>
                                    <div className="bg-black/50 p-4 rounded-lg w-full">
                                        <h1 className="text-2xl font-bold">{config.heroTitle}</h1>
                                        <p className="text-sm mt-1">{config.heroSubtitle}</p>
                                    </div>
                                </div>
                                <div className="bg-amber-100 text-amber-800 p-3 rounded-lg font-medium text-sm">
                                    {config.heroBadgeText}
                                </div>
                                <div className="bg-white p-6 rounded-xl shadow-md space-y-4">
                                    <h2 className="text-lg font-bold text-slate-800">Customer Login</h2>
                                    <form onSubmit={handleCustomerLogin} className="space-y-3">
                                        <input 
                                            type="tel" 
                                            placeholder="Mobile Number" 
                                            value={mobile} 
                                            onChange={(e) => setMobile(e.target.value)}
                                            className="w-full p-3 border rounded-lg"
                                            required
                                        />
                                        <input 
                                            type="password" 
                                            placeholder="4-Digit PIN" 
                                            value={pin} 
                                            onChange={(e) => setPin(e.target.value)}
                                            className="w-full p-3 border rounded-lg"
                                            maxLength="4"
                                            required
                                        />
                                        <button type="submit" className="w-full bg-amber-600 text-white p-3 rounded-lg font-bold hover:bg-amber-700">
                                            Open Loyalty Card
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {view === 'userDashboard' && customers[mobile] && (
                            <div className="bg-white p-6 rounded-xl shadow-md space-y-6">
                                <div className="flex justify-between items-center border-b pb-4">
                                    <h2 className="font-bold text-lg">{mobile}</h2>
                                    <button onClick={() => setView('home')} className="text-sm text-red-600 font-medium">Logout</button>
                                </div>
                                <div className="text-center bg-amber-50 p-4 rounded-xl border border-amber-200">
                                    <p className="text-sm text-amber-800 font-semibold">Your Stamps</p>
                                    <p className="text-3xl font-black text-amber-900 mt-1">{customers[mobile].stamps} / 10</p>
                                </div>
                                <div className="grid grid-cols-5 gap-3">
                                    {[...Array(10)].map((_, idx) => {
                                        const isStamped = idx < customers[mobile].stamps;
                                        return (
                                            <div key={idx} className={`h-14 rounded-xl flex items-center justify-center font-bold text-sm border-2 ${isStamped ? 'bg-amber-600 text-white border-amber-600' : 'bg-slate-100 text-slate-400 border-dashed border-slate-300'}`}>
                                                {idx + 1 === 10 ? '🎁' : idx + 1}
                                            </div>
                                        );
                                    })}
                                </div>
                                <p className="text-xs text-center text-slate-500">Show this card at the counter to get your stamps!</p>
                            </div>
                        )}

                        {view === 'adminLogin' && (
                            <div className="bg-white p-6 rounded-xl shadow-md space-y-4">
                                <h2 className="text-lg font-bold text-slate-800">Admin Login</h2>
                                <input 
                                    type="password" 
                                    placeholder="Enter Admin PIN (7013)" 
                                    value={adminPin} 
                                    onChange={(e) => setAdminPin(e.target.value)}
                                    className="w-full p-3 border rounded-lg"
                                />
                                <button onClick={() => {
                                    if(adminPin === '7013') setView('adminPanel');
                                    else alert('Incorrect Admin PIN');
                                }} className="w-full bg-amber-600 text-white p-3 rounded-lg font-bold">Login</button>
                            </div>
                        )}

                        {view === 'adminPanel' && (
                            <div className="bg-white p-6 rounded-xl shadow-md space-y-4">
                                <div className="flex justify-between items-center">
                                    <h2 className="font-bold text-lg">Admin Panel</h2>
                                    <button onClick={() => setView('home')} className="text-sm text-red-600">Back</button>
                                </div>
                                <input 
                                    type="text" 
                                    placeholder="Search mobile number..." 
                                    value={searchTerm} 
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="w-full p-2 border rounded-lg text-sm"
                                />
                                <div className="space-y-3 max-h-80 overflow-y-auto">
                                    {Object.keys(customers)
                                        .filter(m => m.includes(searchTerm))
                                        .map(m => (
                                            <div key={m} className="p-3 border rounded-lg bg-slate-50 flex flex-col space-y-2">
                                                <div className="flex justify-between items-center">
                                                    <span className="font-bold">{m}</span>
                                                    <span className="bg-amber-100 text-amber-800 px-2 py-0.5 rounded text-xs font-bold">{customers[m].stamps}/10 Stamps</span>
                                                </div>
                                                <div className="flex space-x-2">
                                                    <button onClick={() => updateStamps(m, 1)} className="flex-1 bg-green-600 text-white py-1 rounded text-xs font-bold">+ Stamp</button>
                                                    <button onClick={() => updateStamps(m, -1)} className="flex-1 bg-amber-600 text-white py-1 rounded text-xs font-bold">- Stamp</button>
                                                    <button onClick={() => resetCard(m)} className="bg-red-600 text-white px-3 py-1 rounded text-xs font-bold">Reset</button>
                                                </div>
                                            </div>
                                        ))}
                                </div>
                            </div>
                        )}

                        {view === 'masterLogin' && (
                            <div className="bg-white p-6 rounded-xl shadow-md space-y-4">
                                <h2 className="text-lg font-bold text-slate-800">Master Panel Login</h2>
                                <input 
                                    type="password" 
                                    placeholder="Enter Master PIN (7013557763)" 
                                    value={masterPin} 
                                    onChange={(e) => setMasterPin(e.target.value)}
                                    className="w-full p-3 border rounded-lg"
                                />
                                <button onClick={() => {
                                    if(masterPin === '7013557763') setView('masterPanel');
                                    else alert('Incorrect Master PIN');
                                }} className="w-full bg-slate-900 text-white p-3 rounded-lg font-bold">Login</button>
                            </div>
                        )}

                        {view === 'masterPanel' && (
                            <div className="bg-white p-6 rounded-xl shadow-md space-y-4">
                                <div className="flex justify-between items-center">
                                    <h2 className="font-bold text-lg">Master Customization</h2>
                                    <button onClick={() => setView('home')} className="text-sm text-red-600">Back</button>
                                </div>
                                <div className="space-y-3">
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600">Brand Name</label>
                                        <input type="text" value={config.brandName} onChange={(e) => setConfig({...config, brandName: e.target.value})} className="w-full p-2 border rounded text-sm"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600">Hero Badge Text</label>
                                        <input type="text" value={config.heroBadgeText} onChange={(e) => setConfig({...config, heroBadgeText: e.target.value})} className="w-full p-2 border rounded text-sm"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600">Hero Background URL</label>
                                        <input type="text" value={config.heroBgUrl} onChange={(e) => setConfig({...config, heroBgUrl: e.target.value})} className="w-full p-2 border rounded text-sm"/>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="text-center p-4 text-xs text-slate-500 border-t">
                        {config.footerText}
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
