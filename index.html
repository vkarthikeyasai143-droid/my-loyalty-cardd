<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Copper Skillet - Loyalty</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide-react"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const { Smartphone, Shield, Star, Gift, Check, Lock, User, ArrowLeft, ChevronRight } = LucideReact;

    const INITIAL_SETTINGS = {
      brandName: "The Copper Skillet",
      heroTitle: "Craft food, warm welcome — every visit counts.",
      heroBadge: "10 stamps = Free Craft Burger & Shake",
      cardTitle: "My Loyalty Card",
      cardSubtitle: "One stamp per visit — 10 stamps unlock your free reward.",
      cardFooterText: "One stamp per visit. Rewards are non-transferable.",
      footerText: "Questions? Ask our team on your next visit.",
      loginWelcomeHeading: "Welcome back",
      loginSubHeading: "Enter details to open your loyalty card.",
      mobileLabel: "Mobile number",
      mobilePlaceholder: "10-digit mobile number",
      pinLabel: "6-Digit PIN Code",
      pinPlaceholder: "Enter 6-digit PIN",
      loginButtonText: "View My Loyalty Card",
      invalidMobileError: "Please enter a valid mobile number",
      wrongPinError: "Incorrect 6-digit PIN",
      stampAddedAnimationText: "🎉 Stamp Added Successfully!",
      switchNumberBtnText: "Switch number",
      maxStamps: 10,
      heroBgImage: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=1000&q=80"
    };

    function App() {
      const [activeTab] = React.useState('user');
      const [mobileInput, setMobileInput] = React.useState('');
      const [pinInput, setPinInput] = React.useState('');
      const [mobileError, setMobileError] = React.useState('');
      const [pinError, setPinError] = React.useState('');
      const [currentUserMobile] = React.useState('');
      const [userSession, setUserSession] = React.useState(null);
      const [stampAnimation] = React.useState(false);
      const [settings] = React.useState(INITIAL_SETTINGS);

      const [customers] = React.useState([
        { id: 'c1', mobile: '7013557763', pin: '123456', name: '', stamps: 0, rewards: 0 },
        { id: 'c2', mobile: '1234567890', pin: '123456', name: 'Karthik', stamps: 0, rewards: 0 },
        { id: 'c3', mobile: '9985656800', pin: '123456', name: 'Karthik Sai', stamps: 1, rewards: 0 },
        { id: 'c4', mobile: '9985656803', pin: '123456', name: '', stamps: 0, rewards: 0 },
        { id: 'c5', mobile: '9988776655', pin: '123456', name: 'Priya', stamps: 0, rewards: 1 },
        { id: 'c6', mobile: '9123456780', pin: '123456', name: 'Rohan', stamps: 10, rewards: 0 },
        { id: 'c7', mobile: '9876543210', pin: '123456', name: 'Aarav', stamps: 6, rewards: 0 },
      ]);

      const handleUserLogin = (e) => {
        e.preventDefault();
        setMobileError('');
        setPinError('');

        const trimmedMobile = mobileInput.trim();
        const firstDigit = trimmedMobile.charAt(0);

        if (trimmedMobile.length !== 10 || !['6', '7', '8', '9'].includes(firstDigit)) {
          setMobileError(settings.invalidMobileError);
          return;
        }

        const customer = customers.find(c => c.mobile === trimmedMobile);
        if (customer && customer.pin !== pinInput) {
          setPinError(settings.wrongPinError);
          return;
        }

        if (customer) {
          setUserSession(customer);
        } else {
          setUserSession({
            id: 'c_' + Date.now(),
            mobile: trimmedMobile,
            name: '',
            stamps: 0,
            rewards: 0
          });
        }
      };

      return (
        <div className="min-h-screen bg-slate-100 font-sans text-slate-800 flex items-center justify-center p-2 sm:p-4">
          <div className="w-full max-w-5xl bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200 min-h-[650px] flex flex-col">
            {activeTab === 'user' && (
              <div className="flex-1 flex flex-col md:flex-row">
                {!userSession ? (
                  <>
                    <div className="w-full md:w-1/2 relative min-h-[280px] md:min-h-full flex flex-col justify-end p-6 md:p-10 text-white bg-slate-950 overflow-hidden">
                      <img src={settings.heroBgImage} alt="Background" className="absolute inset-0 w-full h-full object-cover opacity-60" />
                      <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/50 to-transparent"></div>
                      <div className="relative z-10 space-y-3">
                        <div className="w-16 h-16 rounded-full bg-amber-100 text-orange-600 flex items-center justify-center font-bold text-xl shadow-xl border-2 border-white/30">🍳</div>
                        <h1 className="text-2xl md:text-4xl font-extrabold tracking-tight">{settings.brandName}</h1>
                        <p className="text-slate-200 text-sm md:text-base leading-relaxed">{settings.heroTitle}</p>
                        <span className="inline-block bg-orange-500 text-white text-xs font-bold px-3.5 py-1.5 rounded-full shadow-md">✨ {settings.heroBadge}</span>
                      </div>
                    </div>

                    <div className="w-full md:w-1/2 p-6 md:p-12 flex flex-col justify-between bg-white relative">
                      <div className="max-w-md mx-auto w-full my-auto space-y-6">
                        <div>
                          <h2 className="text-2xl font-bold text-slate-900">{settings.loginWelcomeHeading}</h2>
                          <p className="text-slate-500 text-sm mt-1">{settings.loginSubHeading}</p>
                        </div>
                        <form onSubmit={handleUserLogin} className="space-y-4">
                          <div>
                            <label className="block text-xs font-semibold uppercase text-slate-500 mb-1">{settings.mobileLabel}</label>
                            <div className="relative">
                              <Smartphone className="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5" />
                              <input 
                                type="text"
                                maxLength={10}
                                placeholder={settings.mobilePlaceholder}
                                value={mobileInput}
                                onChange={(e) => setMobileInput(e.target.value.replace(/\D/g, ''))}
                                className="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-orange-500 outline-none text-slate-900 text-sm transition-all"
                              />
                            </div>
                            {mobileError && <p className="text-red-500 text-xs mt-1 font-medium">{mobileError}</p>}
                          </div>
                          <div>
                            <label className="block text-xs font-semibold uppercase text-slate-500 mb-1">{settings.pinLabel}</label>
                            <div className="relative">
                              <Lock className="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5" />
                              <input 
                                type="password"
                                maxLength={6}
                                placeholder={settings.pinPlaceholder}
                                value={pinInput}
                                onChange={(e) => setPinInput(e.target.value.replace(/\D/g, ''))}
                                className="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-orange-500 outline-none text-slate-900 text-sm transition-all"
                              />
                            </div>
                            {pinError && <p className="text-red-500 text-xs mt-1 font-medium">{pinError}</p>}
                          </div>
                          <button type="submit" className="w-full py-3 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold rounded-xl shadow-lg shadow-orange-500/25 transition-all flex items-center justify-center gap-2 group">
                            <span>{settings.loginButtonText}</span>
                            <ChevronRight className="w-4 h-4 group-hover:translate-x-1 transition-transform" />
                          </button>
                        </form>
                      </div>
                    </div>
                  </>
                ) : (
                  <div className="w-full flex flex-col min-h-[600px] bg-slate-50">
                    <div className="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center font-bold"><User className="w-5 h-5" /></div>
                        <div>
                          <h3 className="font-bold text-slate-900 text-sm">{settings.brandName}</h3>
                          <p className="text-xs text-slate-500 font-mono">{userSession.mobile}</p>
                        </div>
                      </div>
                      <button onClick={() => setUserSession(null)} className="text-xs font-semibold text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 px-3.5 py-2 rounded-xl transition-colors flex items-center gap-1.5">
                        <ArrowLeft className="w-3.5 h-3.5" />
                        <span>{settings.switchNumberBtnText}</span>
                      </button>
                    </div>

                    <div className="flex-1 p-4 sm:p-8 flex items-center justify-center">
                      <div className="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
                        <div className="bg-gradient-to-br from-orange-500 to-amber-600 p-6 text-white relative">
                          <div className="flex items-center justify-between mb-4">
                            <div>
                              <h2 className="text-xl font-bold">{settings.cardTitle}</h2>
                              <p className="text-xs text-orange-100 mt-0.5">{settings.cardSubtitle}</p>
                            </div>
                            <div className="w-10 h-10 rounded-full bg-white/25 backdrop-blur-md flex items-center justify-center"><Award className="w-5 h-5 text-white" /></div>
                          </div>
                          <div className="space-y-1.5">
                            <div className="flex justify-between items-baseline">
                              <span className="text-2xl font-black">{userSession.stamps} / {settings.maxStamps}</span>
                              <span className="text-xs font-medium text-orange-100">stamps collected</span>
                            </div>
                            <div className="w-full bg-black/20 h-2.5 rounded-full overflow-hidden">
                              <div className="bg-white h-full rounded-full transition-all duration-500 shadow-sm" style={{ width: `${(userSession.stamps / settings.maxStamps) * 100}%` }}></div>
                            </div>
                          </div>
                        </div>
                        <div className="p-6 bg-white space-y-6">
                          <div className="grid grid-cols-5 gap-3">
                            {Array.from({ length: settings.maxStamps }).map((_, idx) => {
                              const isStamped = idx < userSession.stamps;
                              const isLast = idx === settings.maxStamps - 1;
                              return (
                                <div key={idx} className={`aspect-square rounded-full flex items-center justify-center transition-all duration-300 ${isStamped ? 'bg-orange-500 text-white shadow-md shadow-orange-500/30 scale-105' : isLast ? 'bg-gradient-to-tr from-amber-400 to-orange-400 text-white shadow-md animate-pulse' : 'bg-slate-100 text-slate-300 border border-slate-200'}`}>
                                  {isStamped ? <Star className="w-6 h-6 fill-current text-amber-200" /> : isLast ? <Gift className="w-5 h-5 text-white" /> : <span className="text-xs font-bold text-slate-300">{idx + 1}</span>}
                                </div>
                              );
                            })}
                          </div>
                          <p className="text-[11px] text-center text-slate-400 font-medium leading-relaxed">{settings.cardFooterText}</p>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
